<div class="flex min-h-screen">

  <!-- ===== MITAD IZQUIERDA ===== -->
  <div class="hidden lg:flex lg:w-1/2 flex-col items-center justify-center bg-[#1B3A5C] px-12 py-16">

    <!-- Logo -->
    <div class="text-center mb-10">
      <div class="text-6xl mb-4">🏨</div>
      <h1 class="text-4xl font-bold text-[#C9A84C] mb-3">Hotel Reservas</h1>
      <p class="text-white text-lg leading-relaxed max-w-xs">
        Sistema de gestión hotelera profesional
      </p>
    </div>

    <!-- Estadísticas -->
    <div class="flex gap-10 mt-4">
      <div class="text-center">
        <p class="text-2xl font-bold text-[#C9A84C]">500+</p>
        <p class="text-white text-sm mt-1">Habitaciones</p>
      </div>
      <div class="text-center">
        <p class="text-2xl font-bold text-[#C9A84C]">24/7</p>
        <p class="text-white text-sm mt-1">Servicio</p>
      </div>
      <div class="text-center">
        <p class="text-2xl font-bold text-[#C9A84C]">★ 5</p>
        <p class="text-white text-sm mt-1">Estrellas</p>
      </div>
    </div>

  </div>

  <!-- ===== MITAD DERECHA ===== -->
  <div class="flex-1 flex items-center justify-center bg-white px-6 py-12">

    <div class="w-full max-w-md bg-white shadow-xl rounded-2xl p-8">

      <!-- Header tarjeta -->
      <div class="text-center mb-8">
        <div class="text-4xl mb-3 lg:hidden">🏨</div>
        <h2 class="text-2xl font-bold text-[#1B3A5C]">Bienvenido</h2>
        <p class="text-gray-500 text-sm mt-2">Ingresa tus credenciales para continuar</p>
      </div>

      <!-- Mensaje de error -->
      <div *ngIf="error"
        class="flex items-center gap-2 bg-red-50 border border-red-200 text-red-700 rounded-lg p-3 mb-5 text-sm">
        <span class="text-base">⚠️</span>
        <span>{{ error }}</span>
      </div>

      <!-- Formulario -->
      <form (ngSubmit)="login()" #loginForm="ngForm" novalidate>

        <!-- Campo Usuario -->
        <div class="mb-5">
          <label class="block text-sm font-semibold text-gray-700 mb-1">Usuario</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-3 flex items-center text-gray-400 text-base pointer-events-none">👤</span>
            <input
              type="text"
              [(ngModel)]="username"
              name="username"
              placeholder="Ingresa tu usuario"
              required
              class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg text-sm
                     focus:outline-none focus:border-[#C9A84C] focus:ring-2 focus:ring-[#C9A84C]/30
                     transition-all duration-200"
            />
          </div>
        </div>

        <!-- Campo Contraseña -->
        <div class="mb-6">
          <label class="block text-sm font-semibold text-gray-700 mb-1">Contraseña</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-3 flex items-center text-gray-400 text-base pointer-events-none">🔒</span>
            <input
              type="password"
              [(ngModel)]="password"
              name="password"
              placeholder="Ingresa tu contraseña"
              required
              class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg text-sm
                     focus:outline-none focus:border-[#C9A84C] focus:ring-2 focus:ring-[#C9A84C]/30
                     transition-all duration-200"
            />
          </div>
        </div>

        <!-- Botón -->
        <button
          type="submit"
          [disabled]="loading"
          class="w-full flex items-center justify-center gap-2 bg-[#C9A84C] hover:bg-[#B8972A]
                 disabled:opacity-60 disabled:cursor-not-allowed
                 text-white font-semibold py-3 rounded-lg
                 transition-all duration-200 text-sm"
        >
          <svg *ngIf="loading" class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          {{ loading ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
        </button>

      </form>

      <!-- Footer -->
      <p class="text-center text-xs text-gray-400 mt-8">
        © 2025 Hotel Reservas · Todos los derechos reservados
      </p>

    </div>
  </div>

</div>
